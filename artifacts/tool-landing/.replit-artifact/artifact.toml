kind = "web"
previewPath = "/"
title = "TOOL Landing Page"
version = "1.0.0"
id = "artifacts/tool-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18686

[services.development]
run = "pnpm --filter @workspace/tool-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tool-landing", "run", "build" ]
publicDir = "artifacts/tool-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18686"
BASE_PATH = "/"
